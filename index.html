<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đảo Đèn Lồng</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0E1430; font-family: system-ui, sans-serif; }
    #app { position: fixed; inset: 0; }
    #hud { position: fixed; inset: 12px 12px auto 12px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start;
      color: #F5F1E6; text-shadow: 0 1px 3px #000; pointer-events: none; user-select: none; font-size: 15px; }
    #hud .left { justify-self: start; } #hud .mid { justify-self: center; text-align: center; } #hud .right { justify-self: end; text-align: right; }
    .pill { background: rgba(14,20,48,0.6); border: 1px solid rgba(242,193,78,0.3); padding: 5px 11px; border-radius: 999px; display: inline-block; margin: 2px; }
    #clock { font-size: 22px; font-variant-numeric: tabular-nums; }
    #clock.danger, .warn { color: #FF5A5F; }
    /* Bảng màu dễ phân biệt: cảnh báo đổi sang trắng và kèm ⚠ */
    body.cb #clock.danger, body.cb .warn { color: #FFFFFF; }
    body.cb #clock.danger::before, body.cb .warn::before { content: '⚠ '; }
    #motebar { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; pointer-events: none; align-items: center; }
    #motebar b { color: #F5F1E6; font-size: 13px; margin-left: 6px; text-shadow: 0 1px 3px #000; font-variant-numeric: tabular-nums; }
    #overlay label { font-size: 14px; cursor: pointer; user-select: none; }
    #motebar i { width: 16px; height: 16px; border-radius: 4px; background: #2a2f4a; border: 1px solid #555; display: block; }
    #motebar i.on { background: #FFF6C2; box-shadow: 0 0 6px #FFE58A; }
    #cds { position: fixed; bottom: 14px; right: 14px; pointer-events: none; text-align: right; }
    #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px;
      background: rgba(14,20,48,0.82); color: #FFE9B0; text-align: center; padding: 20px; }
    #overlay h1 { font-size: 40px; margin: 0; } #overlay p { margin: 0; opacity: 0.9; max-width: 560px; }
    #overlay .score { font-size: 22px; color: #F2C14E; }
    #overlay button { margin-top: 12px; font-size: 16px; padding: 10px 22px; border-radius: 10px; cursor: pointer; background: #FFB347; color: #201405; border: none; font-weight: 700; }
    #help { position: fixed; bottom: 12px; left: 12px; color: #8FA3B8; font-size: 12px; pointer-events: none; background: rgba(14,20,48,0.5); padding: 6px 10px; border-radius: 8px; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script>
    // Báo lỗi hiện thẳng trên trang (để thấy nếu Three.js không tải được hoặc có lỗi JS).
    function showErr(m) { var d = document.getElementById('err'); if (!d) return; d.style.display = 'block'; d.textContent += m + '\n'; }
    addEventListener('error', function (e) { showErr('Lỗi: ' + (e.message || e.type) + (e.filename ? '\n  ' + e.filename + ':' + e.lineno : '')); });
    addEventListener('unhandledrejection', function (e) { showErr('Lỗi Promise: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)); });
    // Đồng hồ canh: nếu sau 4s game chưa sẵn sàng -> gần như chắc chắn Three.js không tải được.
    setTimeout(function () { if (!window.__gameReady) showErr('Game chưa khởi động sau 4s.\nKhả năng cao: không tải được Three.js từ CDN (mạng bị chặn), hoặc có lỗi JS.\nMở Console (F12) để xem chi tiết.'); }, 4000);
  </script>
</head>
<body>
  <div id="err" style="position:fixed;inset:0;z-index:9999;display:none;padding:20px;color:#ffb4b4;background:rgba(30,0,0,0.95);font:13px/1.5 monospace;white-space:pre-wrap;overflow:auto"></div>
  <div id="app"></div>
  <div id="hud">
    <div class="left"><span class="pill" id="hud-flames">🔥 3</span></div>
    <div class="mid"><span class="pill" id="clock">05:00</span></div>
    <div class="right"><span class="pill" id="hud-night">Đêm 1</span> <span class="pill" id="hud-lanterns">🏮 0/5</span> <span class="pill" id="hud-score">0 điểm</span></div>
  </div>
  <div id="motebar"></div>
  <div id="cds"><span class="pill" id="hud-dash">Lướt ✔</span> <span class="pill" id="hud-pulse">Tỏa ✔</span> <span class="pill" id="hud-charm" style="display:none">Bùa</span></div>
  <div id="overlay">
    <h1 id="ov-title">Đảo Bến</h1>
    <p id="ov-sub"></p>
    <p class="score" id="ov-score"></p>
    <button id="ov-btn">Bắt đầu</button>
    <label><input type="checkbox" id="opt-cb" /> Bảng màu dễ phân biệt (phím C)</label>
  </div>
  <div id="help">WASD di chuyển · ◀▶ xoay cam · Space nhảy · Shift lướt · E nạp đèn / châm dầu · Q tỏa sáng · Esc tạm dừng · C bảng màu</div>
  <script type="module" src="./src/render/main.js"></script>
</body>
</html>
